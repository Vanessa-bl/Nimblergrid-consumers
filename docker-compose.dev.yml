name: hallo-one-dev

services:
  postgres:
    image: postgis/postgis:18-3.6
    # postgis/postgis no publica manifest arm64 (verificado: docker manifest
    # inspect devuelve 0 arm64). En Apple Silicon corre emulado. Sin efecto en
    # hosts amd64. Quitar cuando upstream publique arm64.
    platform: linux/amd64
    container_name: hallo-one-postgres
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=200
    environment:
      POSTGRES_USER: ${DB_USER:-hallo_one}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
      POSTGRES_DB: ${DB_NAME:-hallo_one_dev}
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18+ movió PGDATA a /var/lib/postgresql/<major>/docker y el VOLUME a
      # /var/lib/postgresql. Montar en /data crea un volumen anónimo y pierde datos.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-hallo_one} -d ${DB_NAME:-hallo_one_dev}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    container_name: hallo-one-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-localdev}
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    environment:
      # REDISCLI_AUTH evita pasar la password con -a (visible en process list)
      REDISCLI_AUTH: ${REDIS_PASSWORD:-localdev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: hallo-one-elasticsearch
    environment:
      - discovery.type=single-node
      # Seguridad desactivada SOLO para desarrollo local (puerto en loopback).
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # mem_limit debe superar el heap ~1GB para metaspace, buffers y stacks.
    mem_limit: 1536m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS http://localhost:9200/_cluster/health | grep -vq ''"status":"red"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
